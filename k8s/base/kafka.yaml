# Single-broker Kafka in KRaft mode (no ZooKeeper): one pod that is both broker and controller.
#
# A StatefulSet, not a Deployment, because the pod needs a stable name (kafka-0) and its own
# PersistentVolumeClaim that follows it across restarts. The headless Service gives that pod a
# stable DNS name, kafka-0.kafka.pulseops.svc.cluster.local, which is what the broker advertises
# to clients.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None                 # headless: DNS returns the pod IP, no virtual IP
  publishNotReadyAddresses: true  # resolve kafka-0 even before the pod is Ready
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
      annotations:
        # Datadog consumer-lag check for the service's consumer group. After bootstrapping to the pod
        # IP, the Agent connects to the advertised kafka-0.kafka.pulseops.svc.cluster.local name.
        ad.datadoghq.com/kafka.checks: |
          {
            "kafka_consumer": {
              "init_config": {},
              "instances": [{
                "kafka_connect_str": "%%host%%:9092",
                "consumer_groups": {"pulseops-service": {}}
              }]
            }
          }
    spec:
      # The image turns every KAFKA_* env var into broker config, so don't let Kubernetes
      # inject service-link variables such as KAFKA_PORT.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka   # tag pinned in kustomization.yaml (images:)
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - { name: CLUSTER_ID, value: "pulseops-kraft-cluster1" }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.pulseops.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            # Topics are created only by the kafka-topics Job, with 3 partitions. Without this,
            # a client that starts first would auto-create 1-partition topics.
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }  # on the PVC, not /tmp
            - { name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket: { port: broker }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: broker }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
