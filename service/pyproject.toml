[project]
name = "pulseops-service"
version = "0.1.0"
description = "Checks machine data from Kafka for integrity and production quality, stores it in MongoDB, and serves metrics to Datadog."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka==0.14.0",
    "fastapi==0.162.0",
    "prometheus-client==0.26.0",
    "pydantic==2.14.1",
    "pymongo==4.19.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
