[project]
name = "pulseops-simulator"
version = "0.1.0"
description = "Simulated machines 1-3: publish test results and heartbeats to Kafka with fault injection, or replay a mock-data scenario."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka==0.14.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
